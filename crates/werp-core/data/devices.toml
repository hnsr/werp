# Bundled receiver knowledge. Model identifiers are public, not personal device names.
# Policy is actionable; observations record evidence and must not be inferred as rules.
schema_version = 1

[[devices]]
id = "KPN DIW7022"
aliases = ["DIW7022"]
receiver_app = "Google Cast Default Media Receiver"
firmware = "Not recorded"
scope = "Observations on one development receiver and its connected audio/video setup; not certification of every unit or firmware."
limitations = [
  "AAC surround trials confirm audible output, not discrete six-channel output.",
  "Direct-play codec support does not imply original Matroska support.",
  "Full-duration drift and seeking across every prepared format remain unverified.",
  "H.264 59.94/60 fps requires a local model override; only 50 fps has been observed above 30 fps.",
]

[devices.playback]
allow_hevc = true
allow_aac_surround = true
h264_max_level = 42
h264_max_fps = 50


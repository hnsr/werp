# Copy to ~/.config/yeet/config.toml (or $XDG_CONFIG_HOME/yeet/config.toml).
# Omitted fields use these defaults. These preferences apply only to the CLI.
# Model capabilities belong in devices.toml; see devices.example.toml.

[cli.subtitles]
auto_load = true
languages = ["en", "nl"]

[cli.devices]
# Exact friendly names or stable IDs, highest priority first.
# Example: preferred = ["Living Room", "Bedroom"]
preferred = []

[cli.playback]
auto_resume = true

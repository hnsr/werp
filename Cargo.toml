[workspace]
members = ["crates/werp-core", "crates/werp-cli", "crates/werp-backend"]
default-members = ["crates/werp-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
oxicast = { version = "=0.0.3", default-features = false }
mdns-sd = "0.21"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
getrandom = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
